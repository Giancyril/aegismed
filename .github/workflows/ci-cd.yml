name: Medical Pipeline CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_medical.db
      STORAGE_DIR: storage
      UPLOAD_DIR: storage/uploads
      NIFTI_DIR: storage/nifti
      MASKS_DIR: storage/masks
      USE_MOCK_INFERENCE_IF_NO_GPU: "true"
      MEDICAL_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --no-deps psycopg2-binary || true
          pip install psycopg2-binary || pip install psycopg2 || true
          pip install pytest pytest-asyncio httpx aiosqlite
      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest tests/ -v --tb=short

  inference-tests:
    name: MONAI Transforms & Inference Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inference/requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-asyncio scikit-image
      - name: Run Inference Pytest Suite
        run: |
          cd inference
          pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
      - name: Typecheck and Build
        run: |
          cd frontend
          npm run build
